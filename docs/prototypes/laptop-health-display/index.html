<!doctype html>
<!-- THROWAWAY: three laptop health-display directions on one route, selected by ?variant=A|B|C.
     All readings are fixtures. No network requests, credentials, persistence, or hardware controls. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homelab · display studies</title>
<style>
:root{color-scheme:dark;--bg:#151613;--fg:#e6ddc5;--muted:#aaa591;--line:#464538;--accent:#ddaf69;--good:#bdc9aa;--warn:#f2a477;--unknown:#b2adc5;--mono:'Iosevka','DejaVu Sans Mono',monospace;--sans:'Source Sans 3','Segoe UI',sans-serif;--serif:'TeX Gyre Pagella',Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.35 var(--sans)}button{font:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #a9c8ff;outline-offset:4px}button{touch-action:manipulation}h1,h2,p{margin:0}h1,h2{font-weight:500}small{font-size:14px}strong{font-weight:600}svg{display:block;width:100%;overflow:visible}svg text{font-family:var(--mono)}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font:14px var(--mono);color:var(--muted)}.subtle{color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.unknown{color:var(--unknown)}.status-ink{color:var(--status)}.specimen{min-height:calc(100svh - 104px);padding:24px 38px 18px;max-width:1680px;margin:auto;display:flex;flex-direction:column;gap:22px}.meta{display:flex;justify-content:space-between;gap:16px;align-items:center;color:var(--muted);font:13px var(--mono);letter-spacing:.04em}.demo-label{color:var(--accent);border:1px solid var(--line);padding:5px 9px}.headline{display:flex;justify-content:space-between;align-items:center;gap:24px}.headline h1{font-size:clamp(38px,4.6vw,70px);letter-spacing:-.025em;line-height:1.1}.headline p{margin-top:8px;font-size:20px}.stamp{text-align:right;white-space:nowrap}.stamp strong{display:block;font:42px/1 var(--mono);font-weight:300;margin-bottom:6px}.night{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px;font:14px var(--mono);color:var(--muted);margin-top:auto}.notice{border-left:4px solid var(--status);padding:10px 16px;background:color-mix(in srgb,var(--status) 6%,transparent)}.notice strong{color:var(--status)}.notice p{margin-top:3px;color:var(--muted);font-size:16px}.service-list{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}.service{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;min-width:0}.service .name{font-size:20px}.state-label{font:14px var(--mono);white-space:nowrap;color:var(--good)}.state-label.bad{color:var(--warn)}.state-label.unknown{color:var(--unknown)}.values{display:flex;gap:24px;justify-content:space-between}.value{flex:1;min-width:0}.value strong{display:block;font:38px/1.2 var(--mono);font-weight:400;margin-top:8px}.value small{color:var(--muted)}.value .unit{font-size:.55em}.not-current .value strong{color:var(--unknown)}.not-current .plot-data{opacity:.35}.sensor-note{font-size:14px;color:var(--muted)}
/* A: amber/ivory terminal, aligned character cells and bounded instruments. */
.variant-A{font-family:var(--mono)}.terminal-wordmark{display:flex;justify-content:space-between;border-top:2px solid var(--accent);border-bottom:1px solid var(--line);padding:12px 0}.terminal-wordmark strong{font-size:22px;color:var(--accent);font-weight:500}.variant-A .headline h1{font-size:clamp(34px,4.1vw,62px)}.terminal-main{display:grid;grid-template-columns:1.15fr 1fr;gap:32px}.terminal-box{border:1px solid var(--line);padding:18px 22px;position:relative;margin-top:9px}.terminal-box>h2{position:absolute;top:-11px;left:15px;padding:0 8px;background:var(--bg);font:14px var(--mono);color:var(--accent);letter-spacing:.08em}.variant-A .service-list{grid-template-columns:1fr;gap:0}.variant-A .service{padding:7px 0;border:0}.variant-A .service .name{font-size:20px}.variant-A .state-label{font-size:17px}.instrument{display:grid;grid-template-columns:112px 1fr 72px;gap:14px;align-items:center;margin:16px 0}.instrument:first-of-type{margin-top:4px}.instrument>strong{font-weight:400;text-align:right;color:var(--accent);font-size:25px}.char-meter{color:var(--accent);font:clamp(14px,1.5vw,23px) var(--mono);white-space:nowrap;letter-spacing:1px}.char-meter .empty{color:var(--line)}.terminal-trend{height:58px;margin-top:10px}.terminal-key{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.terminal-bottom{display:grid;grid-template-columns:1.15fr 1fr;gap:32px}.terminal-bottom .notice{font-size:18px}.terminal-bottom .sensor-note{align-self:center}.variant-A .headline p{font-size:17px}.variant-A .night{font-size:13px}
/* B: a wiring drawing. Actual configured edges are separate from measured checks. */
.variant-B{--bg:#152333;--fg:#d9e9f1;--muted:#99b1c5;--line:#385064;--accent:#abc9ee;--good:#a4d3c8;--warn:#ffc39b;--unknown:#c3b8d4;background:var(--bg)}.variant-B .specimen{gap:19px}.variant-B h1{font-weight:600;font-size:clamp(36px,4vw,60px)}.schematic-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;flex:1}.diagram{border-top:1px solid var(--line);padding-top:15px;display:flex;flex-direction:column}.diagram-header{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);gap:16px}.diagram svg{flex:1;min-height:300px;max-height:400px}.wire{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 5;opacity:.7}.node{fill:var(--bg);stroke:var(--line);stroke-width:1.5}.node-main{stroke:var(--accent);stroke-width:2}.node-label{fill:var(--fg);font:22px var(--sans)}.node-sub{fill:var(--muted);font-size:13px}.node-check{fill:var(--good);font-size:13px}.node-check.unknown{fill:var(--unknown)}.drawing-legend{font:13px var(--mono);color:var(--muted);border-top:1px solid var(--line);padding-top:10px}.check-rail{border-left:1px solid var(--line);padding-left:28px}.check-rail h2{margin-bottom:10px}.check-rail .service-list{grid-template-columns:1fr;gap:0}.check-rail .service{padding:9px 0}.check-rail .service .name{font-size:19px}.schematic-bottom{display:grid;grid-template-columns:1fr 1fr;gap:36px;border-top:1px solid var(--line);padding-top:15px}.schematic-bottom .value strong{font-size:29px}.schematic-bottom .value .eyebrow{font-size:12px}.schematic-bottom .values{gap:14px}
/* C: one continuous thermal landscape, with a quiet service ledger underneath. */
.variant-C{--bg:#241d2d;--fg:#eee5ed;--muted:#b9aabf;--line:#4e4058;--accent:#d8b1d4;--good:#bfceba;--warn:#ffbca1;--unknown:#b7bad9;background:var(--bg)}.variant-C .specimen{gap:18px}.observatory-top{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px}.observatory-top h1{font:44px/1.1 var(--serif);letter-spacing:-.035em}.observatory-top p{margin-top:8px}.observatory-top .stamp strong{font-size:31px}.observatory-main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;align-items:center;flex:1}.thermal-number{font:115px/1 var(--serif);letter-spacing:-.07em;margin:8px 0 14px;color:var(--accent)}.thermal-number .degree{font-size:65px;vertical-align:top;line-height:1.25}.thermal-number small{font:18px var(--mono);letter-spacing:0}.thermal-caption{font-size:20px}.thermal-age{margin:12px 0;font:14px var(--mono);color:var(--muted)}.landscape{border-top:1px solid var(--line);padding-top:13px}.chart-topline{display:flex;justify-content:space-between;gap:15px;margin-bottom:2px}.landscape svg{height:205px}.chart-grid{stroke:var(--line);stroke-width:1}.chart-label{fill:var(--muted);font-size:12px}.chart-thermal{stroke:var(--accent);stroke-width:2.5;fill:none}.chart-cpu{stroke:var(--muted);stroke-width:1.5;fill:none}.observatory-resources{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;border-top:1px solid var(--line);padding-top:12px}.observatory-resources .value{display:flex;justify-content:space-between;align-items:center;gap:8px}.observatory-resources .value strong{font-size:27px;margin:0}.observatory-resources .value .eyebrow{font-size:12px}.observatory-services{display:grid;grid-template-columns:220px 1fr;gap:35px;border-top:1px solid var(--line);padding-top:15px}.observatory-services h2{font:26px var(--serif)}.observatory-services .service-list{grid-template-columns:repeat(4,1fr);gap:0 20px}.observatory-services .service{align-items:start;flex-direction:column;gap:3px;border:0;padding:6px 0}.observatory-services .service .name{font-size:18px}.observatory-services .state-label{font-size:12px}.observatory-alerts{font:15px var(--mono);margin-top:8px}.variant-C .notice{padding:8px 16px}.variant-C .notice p{font-size:15px}
/* One shared review harness; deliberately distinct from all three display concepts. */
.prototype-toolbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;max-width:calc(100% - 24px);display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #62697a;background:#252a35;color:#f2f3f7;border-radius:14px;box-shadow:0 8px 32px #0005;font:14px/1.3 var(--sans)}.prototype-toolbar button{border:1px solid transparent;background:transparent;color:#c8ccda;border-radius:7px;padding:9px 11px;font-size:14px;white-space:nowrap}.prototype-toolbar button:hover{background:#3b4354}.prototype-toolbar button[aria-pressed=true]{background:#e4e8f2;color:#232837}.prototype-toolbar .arrow{font-size:20px;padding:5px 12px;background:#3b4354;color:white}.variant-name{min-width:195px;text-align:center}.variant-name b{display:block;font-size:16px}.variant-name span{color:#aeb7c7;font-size:12px}.toolbar-divider{height:30px;width:1px;background:#535968;margin:0 5px}.review-state{position:fixed;right:16px;bottom:93px;font:12px var(--sans);color:#bbc2d0;z-index:4}.review-state summary{cursor:pointer;list-style:none;text-align:right}.review-state[open]{max-width:min(470px,calc(100vw - 32px));padding:14px;background:#252a35;border:1px solid #62697a;border-radius:8px}.review-state pre{white-space:pre-wrap;max-height:320px;overflow:auto}.review-state p{margin-top:10px}.harness-space{height:104px}.large-text .service .name{font-size:24px}.large-text .state-label{font-size:18px}.large-text .headline p{font-size:23px}.large-text .observatory-top h1{font-size:54px}.large-text .night{font-size:17px}.large-text .schematic-layout{grid-template-columns:minmax(0,1fr) 340px}.large-text .observatory-services{grid-template-columns:190px 1fr}.large-text .observatory-services .service-list{grid-template-columns:repeat(4,1fr)}.large-text .observatory-services .service .name{font-size:20px}.large-text .observatory-services .state-label{font-size:14px}
.prototype-toolbar{width:max-content}.state-buttons{display:flex;flex-shrink:0}.variant-name,.scale-button{flex-shrink:0}

@media(min-width:1500px) and (min-height:951px){.specimen{padding:36px 60px 22px;gap:30px}.terminal-main{flex:1}.variant-A .service{padding:12px 0}.instrument{margin:25px 0}.diagram svg{max-height:450px}.observatory-main{gap:65px}.landscape svg{height:280px}}
@media(max-width:1000px){.specimen{padding:20px 24px;gap:20px}.terminal-main,.terminal-bottom{gap:20px}.instrument{grid-template-columns:86px 1fr 58px;gap:6px;font-size:15px}.char-meter{font-size:15px}.terminal-box{padding:16px}.schematic-layout,.large-text .schematic-layout{grid-template-columns:minmax(0,1fr) 230px;gap:20px}.check-rail{padding-left:18px}.schematic-bottom{grid-template-columns:1fr}.observatory-main{grid-template-columns:210px minmax(0,1fr);gap:20px}.observatory-services,.large-text .observatory-services{grid-template-columns:160px 1fr;gap:20px}.observatory-services .service-list,.large-text .observatory-services .service-list{grid-template-columns:repeat(2,1fr)}.prototype-toolbar{gap:2px;padding:8px}.variant-name{min-width:170px}.prototype-toolbar button{padding:8px}.toolbar-divider{margin:0 3px}.night{font-size:12px}.value strong{font-size:30px}}
@media(max-width:700px){.specimen{padding:18px;min-height:calc(100svh - 145px)}.meta{font-size:11px}.meta .meta-extra{display:none}.headline{align-items:start}.headline h1{font-size:31px}.headline p,.variant-A .headline p{font-size:14px}.stamp strong{font-size:27px}.stamp{font-size:12px}.terminal-wordmark{font-size:12px}.terminal-wordmark strong{font-size:16px}.terminal-main,.terminal-bottom{grid-template-columns:1fr}.instrument{grid-template-columns:100px 1fr 65px}.char-meter{font-size:19px}.service-list{grid-template-columns:1fr}.schematic-layout,.large-text .schematic-layout{grid-template-columns:1fr}.diagram svg{min-height:260px}.check-rail{border-left:0;padding:0}.check-rail .service-list{grid-template-columns:1fr 1fr;gap:0 20px}.check-rail .service{flex-direction:column;align-items:start;gap:2px}.schematic-bottom .values{flex-wrap:wrap}.schematic-bottom .value{min-width:38%}.observatory-top h1{font-size:33px}.observatory-main{grid-template-columns:1fr}.thermal-head{display:grid;grid-template-columns:1fr 1fr;align-items:center}.thermal-head>.eyebrow{grid-column:1/-1}.thermal-number{font-size:95px}.thermal-head .thermal-caption{font-size:17px}.thermal-age{grid-column:1/-1}.observatory-services,.large-text .observatory-services{grid-template-columns:1fr;gap:10px}.observatory-resources{gap:10px}.observatory-resources .value{display:block}.observatory-resources .value strong{margin-top:8px}.night{flex-direction:column;gap:4px;font-size:12px}.prototype-toolbar{flex-wrap:wrap;width:420px;justify-content:center;bottom:8px}.prototype-toolbar .variant-name{min-width:235px}.toolbar-divider{display:none}.prototype-toolbar .state-buttons{display:flex;justify-content:center;flex:1 0 100%}.prototype-toolbar .scale-button{position:absolute;right:4px;top:-39px;background:#252a35;border:1px solid #62697a;font-size:12px}.review-state{bottom:155px}.harness-space{height:145px}.large-text .headline h1,.large-text .observatory-top h1{font-size:37px}.large-text .headline p{font-size:18px}}
@media(min-width:701px) and (max-height:950px){.variant-B .headline>.eyebrow,.variant-B .headline>div>.eyebrow{display:none}.variant-B .headline p{font-size:18px}.diagram svg{height:244px;min-height:244px;max-height:244px;flex:none}.check-rail .service{padding:5px 0;line-height:1.2}.check-rail .service .name{font-size:18px}.variant-B .notice p{font-size:14px}.variant-B .notice{font-size:16px}.schematic-bottom .sensor-note{font-size:12px}.variant-C .specimen{gap:14px}.large-text .specimen .service .name{font-size:22px}.large-text .specimen .state-label{font-size:17px}.large-text .specimen .headline h1{font-size:56px}.large-text .specimen .headline p{font-size:20px}.large-text .specimen .observatory-services .service .name{font-size:20px}.large-text .specimen .observatory-services .state-label{font-size:14px}}
@media(max-width:700px){.instrument{grid-template-columns:90px minmax(0,1fr) 60px}.char-meter{font-size:14px;letter-spacing:0}.instrument>strong{font-size:21px}.terminal-wordmark{gap:12px}.terminal-wordmark>span{font-size:11px}.prototype-toolbar .variant-name{min-width:210px}}
.not-current .instrument>strong,.not-current .char-meter,.not-current .thermal-number{color:var(--unknown)}

<body>
<main id="app"></main>
<div id="harness"></div>
<script>
const variants = [
  {key:'A',name:'Terminal instruments',description:'Service checks first · TUI concept'},
  {key:'B',name:'Service schematic',description:'Relationships first · custom GUI'},
  {key:'C',name:'Thermal observatory',description:'Thermals and history first · custom GUI'}
];
const services=['Immich','Paperless-ngx','ArgoCD','Longhorn','Glance','Registry','ntfy','Nix Cache'];
const fixtures={
  normal:{label:'Normal',headline:'Checks passing',subtitle:'8 of 8 HTTP checks pass · 0 active alerts',mark:'OK',cpu:28,memory:43,root:58,temp:54,age:'20s ago',current:true,alerts:0,notice:'Nothing needs attention',detail:'Monitoring is current. The eight displayed service checks pass.',thermal:[49,50,50,52,56,62,59,57,55,53,51,52,52,55,54,54],load:[20,23,24,30,42,60,49,34,30,24,21,27,29,31,28,28]},
  warning:{label:'Warning',headline:'Check Registry',subtitle:'1 HTTP check failing · 1 active alert',mark:'!',cpu:86,memory:67,root:58,temp:83,age:'20s ago',current:true,alerts:1,notice:'Registry is not responding',detail:'The Registry HTTP check has failed for 4 minutes. CPU temperature is rising.',thermal:[49,50,50,52,56,62,59,57,58,62,66,69,72,76,81,83],load:[20,23,24,30,42,60,49,46,60,68,77,78,86,89,88,86]},
  stale:{label:'Stale',headline:'Health unknown',subtitle:'Updates stopped · last data 8 minutes ago',mark:'?',cpu:28,memory:43,root:58,temp:54,age:'8m ago',current:false,alerts:null,notice:'Monitoring data is stale',detail:'Last values are retained and marked old. Current checks and alert count are unknown.',thermal:[49,50,50,52,56,62,59,57,55,53,51,52,52,55,54,54],load:[20,23,24,30,42,60,49,34,30,24,21,27,29,31,28,28]},
  missing:{label:'Missing',headline:'Waiting for data',subtitle:'No readings yet · service health unknown',mark:'?',cpu:null,memory:null,root:null,temp:null,age:'never received',current:false,alerts:null,notice:'No health snapshot received',detail:'Checks, alerts and resources stay unknown until their sources become available.',thermal:[],load:[]}
};
let params=new URLSearchParams(location.search);
let variant=variants.some(v=>v.key===params.get('variant'))?params.get('variant'):'A';
let state=Object.hasOwn(fixtures,params.get('state'))?params.get('state'):'normal';
let large=params.get('scale')==='large';
const demoTime='21:42';
const value=(v,u='')=>v==null?'—':`${v}<span class="unit">${u}</span>`;
function serviceState(name){return !fixtures[state].current?['? UNKNOWN','unknown']:state==='warning'&&name==='Registry'?['! FAIL','bad']:['✓ PASS',''];}
function serviceList(){return `<div class="service-list">${services.map(name=>{const [label,cls]=serviceState(name);return `<div class="service"><span class="name">${name}</span><span class="state-label ${cls}">${label}</span></div>`}).join('')}</div>`;}
function meta(){return `<div class="meta"><span class="demo-label">ILLUSTRATIVE DATA · PROTOTYPE</span><span class="meta-extra">HOMELAB / BUILT-IN DISPLAY</span><span>${variant} · ${fixtures[state].label.toUpperCase()}</span></div>`;}
function stamp(){return `<div class="stamp mono"><strong>${demoTime}</strong><small>Europe/Oslo · sample clock</small></div>`;}
function night(){return `<footer class="night"><span>☾ Screen + lid LEDs off 23:00–08:00</span><span>Europe/Oslo · alerts continue overnight</span></footer>`;}
function notice(){const d=fixtures[state];return `<aside class="notice"><strong>${d.mark} &nbsp;${d.notice}</strong><p>${d.detail}</p></aside>`;}
function metric(label,v,unit){return `<div class="value"><span class="eyebrow">${label}</span><strong>${value(v,unit)}</strong>${state==='stale'?'<small>8m old</small>':state==='missing'?'<small>no data</small>':''}</div>`;}
function meter(v){if(v==null)return '<span class="unknown">············</span>';const n=Math.round(v/100*12);return `${'▰'.repeat(n)}<span class="empty">${'▱'.repeat(12-n)}</span>`;}
function path(values,width,height,min,max,offsetX=0,offsetY=0){return values.map((v,i)=>`${i?'L':'M'}${(offsetX+i/(values.length-1)*width).toFixed(1)},${(offsetY+height-(v-min)/(max-min)*height).toFixed(1)}`).join(' ');}
function VariantA(){const d=fixtures[state];return `<section class="specimen">
  ${meta()}<div class="terminal-wordmark"><strong>homelab : instruments</strong><span>HOST / SERVICES / SIGNAL</span></div>
  <header class="headline"><div><h1 class="status-ink">[${d.mark}] ${d.headline.toUpperCase()}</h1><p class="subtle">${d.subtitle}</p></div>${stamp()}</header>
  <div class="terminal-main"><section class="terminal-box"><h2>HTTP CHECKS / 8 SELECTED SERVICES</h2>${serviceList()}</section>
  <section class="terminal-box"><h2>HOST INSTRUMENTS${state==='stale'?' / OLD DATA':''}</h2>
  ${[['CPU / 5m',d.cpu,'%'],['MEMORY',d.memory,'%'],['ROOT /',d.root,'%'],['CPU TEMP',d.temp,'°C']].map(([label,v,unit])=>`<div class="instrument"><span class="subtle">${label}</span><span class="char-meter">${meter(v)}</span><strong>${v==null?'—':v+unit}</strong></div>`).join('')}
  <div class="terminal-key"><span>CPU TEMP / LAST HOUR</span><span>${d.current?'CURRENT':state==='stale'?'8m OLD':'NO DATA'}</span></div>
  <svg class="terminal-trend" viewBox="0 0 420 55" role="img" aria-label="Illustrative CPU temperature history${state==='stale'?', ending eight minutes ago':''}"><path class="plot-data" d="${path(d.thermal,410,48,40,100,5,0)}" fill="none" stroke="var(--accent)" stroke-width="2"/>${state==='missing'?'<text x="210" y="32" text-anchor="middle" fill="var(--unknown)" font-size="14">NO TEMPERATURE HISTORY</text>':''}</svg>
  <p class="sensor-note">${state==='stale'?'All instruments last known · 8m old':state==='missing'?'All instruments waiting for first data':'Source samples · '+d.age}</p>
  </section></div><div class="terminal-bottom">${notice()}<p class="sensor-note">CPU temperature: illustrative sensor<br>Fan speed / GPU usage: no telemetry<br><br>HTML TUI mockup · terminal compatibility unverified</p></div>${night()}</section>`;}
function VariantB(){const d=fixtures[state];const check=d.current?'✓ HTTP PASS':'? UNKNOWN';return `<section class="specimen">${meta()}
  <header class="headline"><div><div class="eyebrow">Service schematic</div><h1 class="status-ink">${d.headline}</h1><p class="subtle">${d.subtitle}</p></div>${stamp()}</header>
  <div class="schematic-layout"><section class="diagram"><div class="diagram-header"><span>Configured dependencies · selected detail</span><span>${d.current?'Updated '+d.age:d.age}</span></div>
  <svg viewBox="0 0 820 360" role="img" aria-label="Configured dependency excerpts: Immich uses PostgreSQL, Valkey and Longhorn storage. Paperless-ngx uses PostgreSQL, Redis and Longhorn storage. Dependency health is unmeasured.">
  <path class="wire" d="M210 80 H270 V46 H330 M270 80 V120 H330 M210 250 H270 V218 H330 M270 250 V292 H330 M210 80 H240 V171 H698 V142 M210 250 H240 V171 M518 46 H560 V171 M518 218 H560 V171"/>
  <rect x="10" y="37" width="200" height="86" rx="7" class="node node-main"/><text x="28" y="71" class="node-label">Immich</text><text x="28" y="100" class="node-check ${!d.current?'unknown':''}">${check}</text>
  <rect x="10" y="207" width="200" height="86" rx="7" class="node node-main"/><text x="28" y="241" class="node-label">Paperless-ngx</text><text x="28" y="270" class="node-check ${!d.current?'unknown':''}">${check}</text>
  ${[[330,16,'PostgreSQL'],[330,90,'Valkey'],[330,188,'PostgreSQL'],[330,262,'Redis']].map(([x,y,label])=>`<rect x="${x}" y="${y}" width="188" height="60" rx="4" class="node"/><text x="${x+16}" y="${y+26}" class="node-label" style="font-size:19px">${label}</text><text x="${x+16}" y="${y+46}" class="node-sub">health unmeasured</text>`).join('')}
  <rect x="602" y="72" width="200" height="70" rx="7" class="node node-main"/><text x="619" y="102" class="node-label">Longhorn</text><text x="619" y="124" class="node-check ${!d.current?'unknown':''}">${check}</text>
  <text x="602" y="212" class="node-sub">Dashed = configured link</text><text x="602" y="234" class="node-sub">No link health inferred</text><text x="602" y="282" class="node-sub">HTTP pass ≠ volume health</text>
  </svg><p class="drawing-legend">Applications → their dependencies · excerpt, not the complete cluster</p></section>
  <section class="check-rail"><h2 class="eyebrow">HTTP checks · selected 8</h2>${serviceList()}</section></div>
  <div class="schematic-bottom"><div><div class="values">${metric('CPU / 5m',d.cpu,'%')}${metric('Memory',d.memory,'%')}${metric('Root /',d.root,'%')}${metric('CPU temp',d.temp,'°C')}</div><p class="sensor-note" style="margin-top:12px">Illustrative temperature sensor · fan/GPU telemetry unavailable</p></div>${notice()}</div>${night()}</section>`;}
function landscape(){const d=fixtures[state],old=state==='stale',w=old?580:670;return `<div class="landscape"><div class="chart-topline"><span class="eyebrow">Last hour · CPU temperature</span><span class="mono subtle" style="font-size:13px">${old?'History ends 8m ago':d.current?'Source age 20s':'No history'}</span></div>
  <svg viewBox="0 0 740 205" preserveAspectRatio="none" role="img" aria-label="Illustrative one-hour CPU temperature from 40 to 100 degrees Celsius and a separate CPU utilization trace from 0 to 100 percent">
  <defs><linearGradient id="thermal-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--accent)" stop-opacity=".23"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".015"/></linearGradient></defs>
  ${[40,60,80,100].map(v=>`<line class="chart-grid" x1="35" x2="705" y1="${127-(v-40)/60*110}" y2="${127-(v-40)/60*110}"/><text class="chart-label" x="3" y="${132-(v-40)/60*110}">${v}°</text>`).join('')}
  ${d.thermal.length?`<path class="plot-data" d="${path(d.thermal,w,110,40,100,35,17)} L${35+w},127 L35,127 Z" fill="url(#thermal-fill)"/><path class="plot-data chart-thermal" d="${path(d.thermal,w,110,40,100,35,17)}"/>`:''}
  ${old?'<rect x="615" y="17" width="90" height="155" fill="var(--unknown)" opacity=".06"/><line x1="615" x2="615" y1="17" y2="172" stroke="var(--unknown)" stroke-dasharray="3 4"/>':''}
  <text class="chart-label" x="3" y="156">CPU</text><text class="chart-label" x="3" y="171">0–100%</text><path class="plot-data chart-cpu" d="${path(d.load,w,30,0,100,35,142)}"/>
  ${state==='missing'?'<text x="385" y="80" text-anchor="middle" fill="var(--unknown)" font-size="17">Waiting for temperature data</text>':''}
  <text class="chart-label" x="35" y="199">20:42</text><text class="chart-label" x="352" y="199">21:12</text><text class="chart-label" x="705" y="199" text-anchor="end">21:42</text>
  </svg><div class="observatory-resources">${metric('CPU / 5m',d.cpu,'%')}${metric('Memory',d.memory,'%')}${metric('Root /',d.root,'%')}</div></div>`;}
function VariantC(){const d=fixtures[state];return `<section class="specimen">${meta()}<header class="observatory-top"><div><h1>Homelab observatory</h1><p class="status-ink"><strong>${d.mark} &nbsp;${d.headline}</strong> <span class="subtle">· ${d.subtitle}</span></p></div>${stamp()}</header>
  <div class="observatory-main"><section class="thermal-head"><div class="eyebrow">${state==='stale'?'Last known CPU temp':'CPU temperature'}</div><div class="thermal-number">${d.temp==null?'—':d.temp}<span class="degree">${d.temp==null?'':'°'}</span><small>${d.temp==null?'':' C'}</small></div><p class="thermal-caption">${state==='warning'?'Temperature rising':state==='stale'?'Current temperature unknown':state==='missing'?'Sensor data unavailable':'Temperature steady'}</p><p class="thermal-age">${d.current?'Updated '+d.age:d.age}</p><p class="sensor-note">Illustrative CPU sensor<br>Fan / GPU: no telemetry</p></section>${landscape()}</div>
  ${notice()}<section class="observatory-services"><div><h2>Service watch</h2><p class="observatory-alerts status-ink">${d.alerts==null?'? Alerts unknown':d.alerts+' active alerts'}</p><p class="sensor-note">8 selected HTTP checks</p></div>${serviceList()}</section>${night()}</section>`;}
function PrototypeSwitcher(){return `<div class="harness-space"></div><nav class="prototype-toolbar" aria-label="Prototype comparison"><button class="arrow" data-step="-1" aria-label="Previous design">←</button><div class="variant-name" aria-live="polite"><b>${variant} · ${variants.find(v=>v.key===variant).name}</b><span>THROWAWAY DISPLAY STUDY</span></div><button class="arrow" data-step="1" aria-label="Next design">→</button><span class="toolbar-divider"></span><div class="state-buttons">${Object.entries(fixtures).map(([key,f])=>`<button data-state="${key}" aria-pressed="${key===state}">${f.label}</button>`).join('')}</div><span class="toolbar-divider"></span><button class="scale-button" data-scale aria-pressed="${large}">Larger text</button></nav><details class="review-state"><summary>Fixture details ↗</summary><p>${variants.find(v=>v.key===variant).description}. All variants share the same values. Times are frozen; changing a scenario is not a live refresh.</p><pre id="fixture-json"></pre></details>`;}
function updateURL(){const q=new URLSearchParams({variant,state});if(large)q.set('scale','large');history.replaceState(null,'','?'+q);render();}
function cycle(delta){variant=variants[(variants.findIndex(v=>v.key===variant)+delta+3)%3].key;updateURL();}
function render(){const d=fixtures[state];document.body.className=`variant-${variant} ${d.current?'':'not-current'} ${large?'large-text':''}`;document.body.style.setProperty('--status',d.current?(state==='warning'?'var(--warn)':'var(--good)'):'var(--unknown)');document.getElementById('app').innerHTML=({A:VariantA,B:VariantB,C:VariantC})[variant]();
  // This file is a prototype only. Comparison controls are restricted to local/file use.
  const local=['localhost','127.0.0.1','[::1]'].includes(location.hostname)||location.protocol==='file:';
  document.getElementById('harness').innerHTML=local?PrototypeSwitcher():'<div class="harness-space"></div>';
  if(local){document.getElementById('fixture-json').textContent=JSON.stringify({variant,scenario:state,clock:demoTime,largeText:large,...d,selectedChecks:services,dependencyHealth:'unmeasured',fan:'unavailable',gpu:'unavailable'},null,2);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>cycle(Number(b.dataset.step)));document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;updateURL()});document.querySelector('[data-scale]').onclick=()=>{large=!large;updateURL()};}
  document.title=`${variant} · ${variants.find(v=>v.key===variant).name} · ${d.label} · Homelab prototype`;
}
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);variant=variants.some(v=>v.key===p.get('variant'))?p.get('variant'):'A';state=Object.hasOwn(fixtures,p.get('state'))?p.get('state'):'normal';large=p.get('scale')==='large';render()});
render();
</script>
</body>
