name: Cache Nix builds
description: Substitute store paths that earlier CI runs built locally, plus numtide's cache

# Magic Nix Cache stored one GitHub cache entry per store path. Parallel PR runs
# hit GitHub's cache rate limit, which disabled uploads for the whole job, so
# nothing was ever reused. One archive per run is a single request each way.
# Jobs that should publish their builds also run ./.github/actions/nix-cache-save.

runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v6.1.0
      with:
        path: ~/.cache/homelab-nix
        key: homelab-nix-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: homelab-nix-
    - name: Substitute from earlier builds
      shell: bash
      run: |
        cache="$HOME/.cache/homelab-nix"
        mkdir -p "$cache" ~/.config/nix
        # Initialise as the runner; the root daemon would otherwise create
        # directories that the save step cannot write to.
        nix store info --store "file://$cache" >/dev/null
        # Local disk answers before cache.nixos.org (priority 40). Fall back to
        # building if an entry is unreadable instead of failing the job.
        # llm-agents doesn't follow our nixpkgs, so its builds (codex, T3 Code)
        # are only cached by numtide; from source they outlast the job timeout.
        cat >> ~/.config/nix/nix.conf <<EOF
        extra-substituters = file://$cache?trusted=1&priority=10 https://cache.numtide.com
        fallback = true
        extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
        EOF
