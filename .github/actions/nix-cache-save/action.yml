name: Save Nix builds
description: Publish this run's locally built store paths for later CI runs

# Pairs with ./.github/actions/nix-cache, which must run earlier in the job.
# The entry holds only what this run built or reused; public packages stay on
# cache.nixos.org, and restored paths this run never needed are dropped.

runs:
  using: composite
  steps:
    - name: Collect locally built paths
      shell: bash
      run: |
        cache="$HOME/.cache/homelab-nix"
        nix path-info --all --json --json-format 1 \
          | python3 "$GITHUB_ACTION_PATH/collect.py" "$cache"
        du -sh "$cache"
    - uses: actions/cache/save@v6.1.0
      with:
        path: ~/.cache/homelab-nix
        key: homelab-nix-${{ github.run_id }}-${{ github.run_attempt }}
