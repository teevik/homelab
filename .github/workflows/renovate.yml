name: Renovate

on:
  # Run weekly on Monday at 6:00 UTC (8:00 CET)
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # renovate.json5 is discovered as repository config. Passing it through
      # configurationFile would load every custom manager twice.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.5
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
