name: Regenerate manifests

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - "kubernetes/**"
      - "charts/**"
      - "flake.nix"
      - "flake.lock"

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Refresh pinned Helm chart hashes
        run: nix develop --command python3 scripts/update-chart-hashes.py charts

      - name: Regenerate manifests
        run: nix develop --command nixidy switch .#homelab

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/ manifests/
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: regenerate manifests"
            git push
          fi
