apiVersion: v1
data:
  Dockerfile: |
    # Community packaging; CubeCoders does not support running the ADS controller
    # in a container. Pin the dependency image; AMP manages its own runtime updates.
    FROM mitchtalmadge/amp-dockerized:v28@sha256:de89e8919d39ebd560afaeeb435312210aa73b58c7f1d2ab0b2dddf04ee182b6

    # The upstream entrypoint creates this user as root on every boot. Create it
    # at build time instead so the entire Kubernetes workload can be non-root.
    RUN apt-get update && apt-get install --yes --no-install-recommends tini=0.19.0-3+b8 \
        && rm -rf /var/lib/apt/lists/* \
        && groupadd --gid 1000 amp && useradd --uid 1000 --gid amp --create-home --shell /bin/bash amp
    COPY entrypoint.py /opt/homelab/
    ENV HOME=/home/amp JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64
    USER 1000:1000
    WORKDIR /home/amp
    # AMP detaches through tmux. Reap those orphaned children so the manager can
    # detect exited instances, and forward SIGTERM only to our graceful supervisor.
    ENTRYPOINT ["/usr/bin/tini", "--", "python3", "-u", "/opt/homelab/entrypoint.py"]
  entrypoint.py: |
    """Run the AMP instance manager without root or a Docker socket."""

    import json
    import os
    from pathlib import Path
    import signal
    import subprocess
    import sys
    import threading
    import time
    import urllib.error
    import urllib.request


    STATE = Path('/home/amp/.homelab')
    READY = Path('/tmp/amp-ready')
    SECRETS = Path('/run/secrets/amp')
    STOPPING = threading.Event()


    def secret(name):
        return (SECRETS / name).read_text().rstrip('\r\n')


    class API:
        def __init__(self, base='http://127.0.0.1:8080/', session=None):
            self.base = base
            self.session = session

        def call(self, method, **params):
            headers = {'Content-Type': 'application/json', 'Accept': 'application/vnd.cubecoders-ampapi'}
            if self.session:
                headers['Authorization'] = 'Bearer ' + self.session
            request = urllib.request.Request(
                self.base + 'API/' + method, json.dumps(params).encode(),
                headers,
            )
            with urllib.request.urlopen(request, timeout=60) as response:
                body = response.read()
            result = json.loads(body) if body else None
            if isinstance(result, dict):
                if result.get('Status') is False or result.get('success') is False:
                    # API errors may contain credentials/configuration; log only
                    # the operation and inspect details interactively in AMP.
                    raise RuntimeError(f'AMP rejected {method}; inspect the AMP logs')
                if set(result) == {'result'}:
                    return result['result']
            return result

        def login(self):
            result = self.call('Core/Login', username='admin',
                               password=secret('AMP_ADMIN_PASSWORD'), token='', rememberMe=False)
            self.session = result.get('sessionID')
            if not self.session:
                raise RuntimeError('AMP admin login failed')

        def settings(self, values):
            encoded = {key: value if isinstance(value, str) else json.dumps(value)
                       for key, value in values.items()}
            if self.call('Core/SetConfigs', data=encoded) is not True:
                raise RuntimeError('AMP did not accept its configuration')


    def manager(*args, wait=True):
        # QuickStart requires its bootstrap password as a CLI argument. No shell
        # interpolation and no manager output: upstream can print provisioning data.
        process = subprocess.Popen(['ampinstmgr', *args], stdin=subprocess.DEVNULL,
                                   stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
        if not wait:
            return process
        if process.wait(timeout=240):
            raise RuntimeError(f'AMP instance manager failed: {args[0]}')


    def login_when_ready(deadline=900):
        end = time.monotonic() + deadline
        while time.monotonic() < end and not STOPPING.is_set():
            api = API()
            try:
                api.login()
                return api
            except (OSError, ValueError, RuntimeError, urllib.error.URLError):
                STOPPING.wait(3)
        raise RuntimeError('AMP did not become ready; inspect its persistent AMP_Logs')


    def standalone(api):
        # Same standalone configuration as the official ADS first-run wizard.
        api.settings({
            'ADSModule.ADS.Mode': '100',
            'ADSModule.Limits.CreateLocalInstances': True,
            'Core.Security.EnablePassthruAuth': True,
            'Core.AMP.MapAllPluginStores': True,
            'Core.Login.UseAuthServer': False,
            'Core.Login.AuthServerURL': 'http://localhost:8080',
            'ADSModule.Network.DefaultIPBinding': '127.0.0.1',
            'ADSModule.Defaults.DefaultAuthServerURL': 'http://localhost:8080',
            'ADSModule.Defaults.UseDocker': False,
            'ADSModule.Network.DefaultAppIPBinding': '0.0.0.0',
            'ADSModule.Network.DefaultAdvertisedAddress': 'games.teevik.no',
            'Core.Webserver.UsingReverseProxy': True,
            'Core.Webserver.ReverseProxyHosts': ['127.0.0.1'],
            'Core.AMP.SchedulerTimezoneId': 'Europe/Oslo',
            'Core.Privacy.AllowAnalytics': False,
            'Core.Privacy.AutoReportFatalExceptions': False,
            'Core.Privacy.PrivacySettingsSet': True,
        })


    def stop(_signum=None, _frame=None):
        STOPPING.set()
        READY.unlink(missing_ok=True)


    def safe_error(error):
        # subprocess.TimeoutExpired includes the original argv (QuickStart has a
        # password argument). Only our own RuntimeErrors contain safe diagnostics.
        return str(error) if type(error) is RuntimeError else type(error).__name__


    def main():
        os.umask(0o077)
        STATE.mkdir(exist_ok=True)
        READY.unlink(missing_ok=True)
        signal.signal(signal.SIGTERM, stop)
        signal.signal(signal.SIGINT, stop)
        quickstart = None
        try:
            if not Path('/home/amp/.ampdata/instances/ADS01/AMPConfig.conf').exists():
                print('Installing the AMP controller; the first download can take several minutes.')
                quickstart = manager('QuickStart', 'admin', secret('AMP_ADMIN_PASSWORD'),
                                     '127.0.0.1', '8080', wait=False)
            else:
                manager('StartBoot')

            if not (STATE / 'standalone').exists():
                api = login_when_ready()
                standalone(api)
                # QuickStart waits for the first-run wizard to restart AMP before
                # it exits. A resumed, interrupted setup uses the manager instead.
                if quickstart:
                    try:
                        api.call('Core/RestartAMP')
                    except (OSError, urllib.error.URLError):
                        pass  # The HTTP connection can close during restart.
                    if quickstart.wait(timeout=180):
                        raise RuntimeError('AMP QuickStart failed')
                else:
                    manager('RestartInstance', 'ADS01')
                login_when_ready()
                (STATE / 'standalone').touch()
                print('AMP standalone controller configured.')

            READY.touch()
            print('AMP is running. Manage accounts and games in the panel.')
            while not STOPPING.is_set():
                if (SECRETS / 'AMP_LICENSE_KEY').exists() and not (STATE / 'licensed').exists():
                    try:
                        api = login_when_ready()
                        api.call('Core/ActivateAMPLicence', LicenceKey=secret('AMP_LICENSE_KEY'), QueryOnly=False)
                        api.settings({'ADSModule.Defaults.NewInstanceKey': secret('AMP_LICENSE_KEY')})
                        (STATE / 'licensed').touch()
                        print('AMP licence activated. Create game instances in the panel.')
                    except Exception as error:
                        print(f'AMP licence activation pending: {safe_error(error)}')
                        # Keep the panel accessible for diagnosis. Interrupted
                        # setup resumes without recreating completed resources.
                        STOPPING.wait(240)
                if STOPPING.wait(60):
                    break
                manager('ProcessPendingTasks')
        finally:
            stop()
            print('Stopping game instances and AMP gracefully.')
            manager('StopAll')
            if quickstart and quickstart.poll() is None:
                quickstart.terminate()
                quickstart.wait(timeout=30)


    if __name__ == '__main__':
        try:
            main()
        except Exception as error:
            # Never dump API response bodies or provisioning arguments.
            print(f'AMP startup failed: {safe_error(error)}', file=sys.stderr)
            sys.exit(1)
