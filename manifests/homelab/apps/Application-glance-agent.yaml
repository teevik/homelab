apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glance-agent
  namespace: argocd
spec:
  destination:
    namespace: glance
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/homelab/glance-agent
    repoURL: https://github.com/teevik/homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
