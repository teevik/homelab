apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless-ngx
  namespace: argocd
spec:
  destination:
    namespace: paperless-ngx
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/homelab/paperless-ngx
    repoURL: git@github.com:teevik/homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
