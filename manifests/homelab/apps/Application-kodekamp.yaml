apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kodekamp
  namespace: argocd
spec:
  destination:
    namespace: kodekamp
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/homelab/kodekamp
    repoURL: git@github.com:teevik/homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
      limit: 3
