apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kavita
  namespace: argocd
spec:
  destination:
    namespace: kavita
    server: https://kubernetes.default.svc
  project: default
  source:
    path: ./manifests/homelab/kavita
    repoURL: git@github.com:teevik/homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
