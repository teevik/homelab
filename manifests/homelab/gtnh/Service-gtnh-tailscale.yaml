apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: gtnh
    tailscale.com/proxy-group: ingress
  name: gtnh-tailscale
  namespace: gtnh
spec:
  loadBalancerClass: tailscale
  ports:
    - name: minecraft
      port: 25565
      protocol: TCP
      targetPort: 25565
  selector:
    app: gtnh
  type: LoadBalancer
