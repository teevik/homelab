apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      annotations:
        checksum/config: da8f35704e2c9dda7710182b43ee4b0d7c196934d483ddaa4281f18ca13333ff
      labels:
        app: glance
    spec:
      containers:
        - image: glanceapp/glance:v0.8.6@sha256:9dfb09470b207dcb67ac715994bdb1929374ba3f9c0d7df7462c24adf10fd073
          name: glance
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - mountPath: /app/config/glance.yml
              name: config
              subPath: glance.yml
      volumes:
        - configMap:
            name: glance-config
          name: config
