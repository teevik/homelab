apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      annotations:
        checksum/config: 8cc390fc0e5fb4f0626a7788dda0476fd7baf1b4dfe105a5f5117353857766c2
      labels:
        app: glance
    spec:
      containers:
        - image: glanceapp/glance:v0.8.5@sha256:32ab73d80f2b8b5fb0735b0431deb36b93fbb6b2fb43592449b0178c8b83e350
          name: glance
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - mountPath: /app/assets/dashboard.css
              name: config
              subPath: dashboard.css
            - mountPath: /app/config/glance.yml
              name: config
              subPath: glance.yml
      volumes:
        - configMap:
            name: glance-config
          name: config
