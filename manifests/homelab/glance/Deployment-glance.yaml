apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance
  template:
    metadata:
      annotations:
        checksum/config: 08830ee1b1d2de211449ec156227f97afa08f6421d10d61a7aca77f76707c88e
      labels:
        app: glance
    spec:
      containers:
        - image: glanceapp/glance:v0.8.4@sha256:6df86a7e8868d1eda21f35205134b1962c422957e42a0c44d4717c8e8f741b1a
          name: glance
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - mountPath: /app/config/glance.yml
              name: config
              subPath: glance.yml
      volumes:
        - configMap:
            name: glance-config
          name: config
