apiVersion: v1
data:
  dashboard.css: |
    /* Use Glance's palette and type scale. Keep long Kubernetes names readable. */
    .homelab-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .homelab-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .homelab-value {
      flex-shrink: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Glance retains the last successful HTML on a transport error. Replace it
       with an explicit unavailable state so cached "All clear" cannot survive. */
    .homelab-unavailable {
      display: none;
    }

    .homelab-metrics:has(.widget-header .notice-icon-major) .homelab-current {
      display: none;
    }

    .homelab-metrics:has(.widget-header .notice-icon-major) .homelab-unavailable {
      display: block;
    }
  glance.yml: '{"pages":[{"columns":[{"size":"full","widgets":[{"cache":"1m","css-class":"homelab-metrics","parameters":{"query":"min by(job) (up{job=~\"kube-state-metrics|argocd-application-controller-metrics|vmalert-vm-victoria-metrics-k8s-stack\"} * (timestamp(up{job=~\"kube-state-metrics|argocd-application-controller-metrics|vmalert-vm-victoria-metrics-k8s-stack\"}) > bool time() - 180))"},"subrequests":{"alerts":{"parameters":{"active":"true","filter":"alertname!~\"Watchdog|InfoInhibitor\"","inhibited":"false","silenced":"false"},"url":"http://vmalertmanager-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:9093/api/v2/alerts"},"apps":{"parameters":{"query":"max by(name, health_status, sync_status) (argocd_app_info)"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},"inventory":{"parameters":{"query":"count(kube_pod_info)"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},"pods":{"parameters":{"query":"max by(namespace, pod) (kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"} == 1 or kube_pod_status_ready{condition=\"false\"} == 1) unless on(namespace, pod) (kube_pod_status_phase{phase=\"Succeeded\"} == 1)"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},"restarts":{"parameters":{"query":"sort_desc(sum by(namespace, pod) (round(increase_prometheus(kube_pod_container_status_restarts_total[1h]))) > 0)"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"}},"template":"{{ $ok := and (eq .Response.StatusCode 200) (eq (.JSON.String \"status\") \"success\") (eq (len (.JSON.Array \"data.result\")) 3) }}\n{{ range .JSON.Array \"data.result\" }}\n  {{ if ne (.Float \"value.1\") 1.0 }}{{ $ok = false }}{{ end }}\n{{ end }}\n{{ $apps := .Subrequest \"apps\" }}\n{{ if not (and (eq $apps.Response.StatusCode 200) (eq ($apps.JSON.String \"status\") \"success\") (eq ($apps.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ $inventory := .Subrequest \"inventory\" }}\n{{ if not (and (eq $inventory.Response.StatusCode 200) (eq ($inventory.JSON.String \"status\") \"success\") (eq ($inventory.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ $pods := .Subrequest \"pods\" }}\n{{ if not (and (eq $pods.Response.StatusCode 200) (eq ($pods.JSON.String \"status\") \"success\") (eq ($pods.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ $restarts := .Subrequest \"restarts\" }}\n{{ if not (and (eq $restarts.Response.StatusCode 200) (eq ($restarts.JSON.String \"status\") \"success\") (eq ($restarts.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ if eq (len ($apps.JSON.Array \"data.result\")) 0 }}{{ $ok = false }}{{ end }}\n\n{{ if eq (len ($inventory.JSON.Array \"data.result\")) 0 }}{{ $ok = false }}{{ end }}\n\n<div class=\"homelab-unavailable\">\n  <p class=\"color-negative\">Update unavailable</p>\n  <p class=\"size-h5 margin-top-5\">Could not refresh this card. Open its title for details.</p>\n</div>\n<div class=\"homelab-current\">\n  {{ $alerts := .Subrequest \"alerts\" }}\n{{ if not (and (eq $alerts.Response.StatusCode 200) ($alerts.JSON.Exists \"#\")) }}{{ $ok = false }}{{ end }}\n{{ if not $ok }}\n  <p class=\"color-negative size-h3\">Health status unavailable</p>\n  <p class=\"margin-top-5\">Some monitoring data is missing or older than three minutes. Open the overview to investigate.</p>\n{{ else }}\n  {{ $issues := len ($alerts.JSON.Array \"\") }}\n  {{ range $apps.JSON.Array \"data.result\" }}\n    {{ if or (ne (.String \"metric.health_status\") \"Healthy\") (ne (.String \"metric.sync_status\") \"Synced\") }}{{ $issues = add $issues 1 }}{{ end }}\n  {{ end }}\n  {{ $issues = add $issues (len ($pods.JSON.Array \"data.result\")) }}\n  {{ $issues = add $issues (len ($restarts.JSON.Array \"data.result\")) }}\n  {{ if eq $issues 0 }}\n    <p class=\"color-positive size-h2\">All clear</p>\n    <p class=\"margin-top-5\">Apps are healthy and synced. No active alerts, unready pods, or restarts in the last hour.</p>\n  {{ else }}\n    <p class=\"color-negative size-h2\">{{ $issues }} {{ if eq $issues 1 }}item needs{{ else }}items need{{ end }} attention</p>\n    <ul class=\"list list-gap-15 list-with-separator margin-top-15 collapsible-container\" data-collapse-after=\"5\">\n      {{ range $alerts.JSON.Array \"\" }}\n        <li>\n          <a class=\"color-highlight\" href=\"http://grafana/alerting/list\">{{ if .String \"annotations.summary\" }}{{ .String \"annotations.summary\" }}{{ else }}{{ .String \"labels.alertname\" }}{{ end }}</a>\n          <p class=\"size-h5\">{{ .String \"labels.severity\" }}{{ if .String \"labels.namespace\" }} · {{ .String \"labels.namespace\" }}{{ end }} · firing <span {{ .String \"startsAt\" | parseTime \"rfc3339\" | toRelativeTime }}></span></p>\n        </li>\n      {{ end }}\n      {{ range $apps.JSON.Array \"data.result\" }}\n        {{ if or (ne (.String \"metric.health_status\") \"Healthy\") (ne (.String \"metric.sync_status\") \"Synced\") }}\n          <li>\n            <a class=\"color-highlight\" href=\"http://argocd/applications/argocd/{{ .String \"metric.name\" }}\">{{ .String \"metric.name\" }}</a>\n            <p class=\"size-h5\">Deployment · {{ .String \"metric.health_status\" }} · {{ .String \"metric.sync_status\" }}</p>\n          </li>\n        {{ end }}\n      {{ end }}\n      {{ range $pods.JSON.Array \"data.result\" }}\n        <li>\n          <p class=\"color-highlight homelab-name\">{{ .String \"metric.pod\" }}</p>\n          <p class=\"size-h5\">{{ .String \"metric.namespace\" }} · pod is not ready</p>\n        </li>\n      {{ end }}\n      {{ range $restarts.JSON.Array \"data.result\" }}\n        <li>\n          <p class=\"color-highlight homelab-name\">{{ .String \"metric.pod\" }}</p>\n          <p class=\"size-h5\">{{ .String \"metric.namespace\" }} · {{ .Float \"value.1\" | printf \"%.0f\" }} restarts in the last hour</p>\n        </li>\n      {{ end }}\n    </ul>\n  {{ end }}\n{{ end }}\n\n  <p class=\"size-h6 color-subdue margin-top-15\">Checked <span {{ now | toRelativeTime }}></span> ago · refresh to update</p>\n</div>\n","title":"Needs attention","title-url":"http://grafana/d/homelab-overview","type":"custom-api","url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},{"cache":"1m","css-class":"homelab-metrics","parameters":{"query":"min by(job) (up{job=~\"kube-state-metrics|longhorn-backend\"} * (timestamp(up{job=~\"kube-state-metrics|longhorn-backend\"}) > bool time() - 180))"},"subrequests":{"failures":{"parameters":{"query":"(count by(volume) (longhorn_backup_state == 4) * on(volume) group_left(pvc, pvc_namespace) max by(volume, pvc, pvc_namespace) (longhorn_volume_last_backup_at * 0 + 1)) and on(pvc, pvc_namespace) max by(pvc, pvc_namespace) (label_replace(label_replace(kube_persistentvolumeclaim_labels{label_recurring_job_group_longhorn_io_backup=\"enabled\"}, \"pvc\", \"$1\", \"persistentvolumeclaim\", \"(.*)\"), \"pvc_namespace\", \"$1\", \"namespace\", \"(.*)\"))"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},"volumes":{"parameters":{"query":"sort((max by(pvc, pvc_namespace) (longhorn_volume_last_backup_at) and on(pvc, pvc_namespace) max by(pvc, pvc_namespace) (label_replace(label_replace(kube_persistentvolumeclaim_labels{label_recurring_job_group_longhorn_io_backup=\"enabled\"}, \"pvc\", \"$1\", \"persistentvolumeclaim\", \"(.*)\"), \"pvc_namespace\", \"$1\", \"namespace\", \"(.*)\"))) or on(pvc, pvc_namespace) (max by(pvc, pvc_namespace) (label_replace(label_replace(kube_persistentvolumeclaim_labels{label_recurring_job_group_longhorn_io_backup=\"enabled\"}, \"pvc\", \"$1\", \"persistentvolumeclaim\", \"(.*)\"), \"pvc_namespace\", \"$1\", \"namespace\", \"(.*)\")) * -1))"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"}},"template":"{{ $ok := and (eq .Response.StatusCode 200) (eq (.JSON.String \"status\") \"success\") (eq (len (.JSON.Array \"data.result\")) 2) }}\n{{ range .JSON.Array \"data.result\" }}\n  {{ if ne (.Float \"value.1\") 1.0 }}{{ $ok = false }}{{ end }}\n{{ end }}\n{{ $failures := .Subrequest \"failures\" }}\n{{ if not (and (eq $failures.Response.StatusCode 200) (eq ($failures.JSON.String \"status\") \"success\") (eq ($failures.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ $volumes := .Subrequest \"volumes\" }}\n{{ if not (and (eq $volumes.Response.StatusCode 200) (eq ($volumes.JSON.String \"status\") \"success\") (eq ($volumes.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n\n<div class=\"homelab-unavailable\">\n  <p class=\"color-negative\">Update unavailable</p>\n  <p class=\"size-h5 margin-top-5\">Could not refresh this card. Open its title for details.</p>\n</div>\n<div class=\"homelab-current\">\n  {{ if not $ok }}\n  <p class=\"color-negative size-h3\">Backup status unavailable</p>\n  <p class=\"margin-top-5\">Storage or volume inventory data is missing or older than three minutes. Check Longhorn before relying on these backups.</p>\n{{ else if eq (len ($volumes.JSON.Array \"data.result\")) 0 }}\n  <p class=\"color-negative\">No protected volumes found</p>\n  <p class=\"margin-top-5\">Check the backup labels on your application volumes.</p>\n{{ else }}\n  {{ $healthy := 0 }}\n  {{ range $volumes.JSON.Array \"data.result\" }}\n    {{ $timestamp := .Float \"value.1\" }}\n    {{ if and (gt $timestamp 0.0) (le (sub (.Float \"value.0\") $timestamp) 108000.0) }}{{ $healthy = add $healthy 1 }}{{ end }}\n  {{ end }}\n  <p class=\"size-h2 {{ if eq $healthy (len ($volumes.JSON.Array \"data.result\")) }}color-positive{{ else }}color-negative{{ end }}\">{{ $healthy }} of {{ len ($volumes.JSON.Array \"data.result\") }} backups current</p>\n  <p class=\"size-h5 margin-top-5\">Off-site · daily at 02:00 UTC · overdue after 30 hours</p>\n  {{ if gt (len ($failures.JSON.Array \"data.result\")) 0 }}\n    <ul class=\"list list-gap-5 margin-top-15\">\n      {{ range $failures.JSON.Array \"data.result\" }}\n        <li class=\"color-negative homelab-name\">{{ .String \"metric.pvc\" }} · {{ .Float \"value.1\" | printf \"%.0f\" }} failed backup records in Longhorn</li>\n      {{ end }}\n    </ul>\n  {{ end }}\n  <ul class=\"list list-gap-10 list-with-separator margin-top-15 collapsible-container\" data-collapse-after=\"5\">\n    {{ range $volumes.JSON.Array \"data.result\" }}\n      {{ $timestamp := .Float \"value.1\" }}\n      <li class=\"homelab-row\">\n        <div class=\"min-width-0\">\n          <p class=\"color-highlight homelab-name\">{{ .String \"metric.pvc\" }}</p>\n          <p class=\"size-h6\">{{ .String \"metric.pvc_namespace\" }}</p>\n        </div>\n        <div class=\"homelab-value\">\n          {{ if lt $timestamp 0.0 }}\n            <p class=\"color-negative\">Unknown</p>\n            <p class=\"size-h6\">Backup data missing</p>\n          {{ else if eq $timestamp 0.0 }}\n            <p class=\"color-negative\">Never backed up</p>\n          {{ else }}\n            {{ $overdue := gt (sub (.Float \"value.0\") $timestamp) 108000.0 }}\n            <p class=\"{{ if $overdue }}color-negative{{ else }}color-positive{{ end }}\"><span data-dynamic-relative-time=\"{{ $timestamp | toInt }}\"></span> ago</p>\n            <p class=\"size-h6\">{{ if $overdue }}Overdue{{ else }}Successful{{ end }}</p>\n          {{ end }}\n        </div>\n      </li>\n    {{ end }}\n  </ul>\n{{ end }}\n\n  <p class=\"size-h6 color-subdue margin-top-15\">Checked <span {{ now | toRelativeTime }}></span> ago · refresh to update</p>\n</div>\n","title":"Backups","title-url":"http://longhorn/#/backup","type":"custom-api","url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},{"cache":"1m","css-class":"homelab-metrics","parameters":{"query":"min by(job) (up{job=~\"node-exporter|kubelet\"} * (timestamp(up{job=~\"node-exporter|kubelet\"}) > bool time() - 180))"},"subrequests":{"cpu":{"parameters":{"query":"100 * (1 - avg(rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])))"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},"memory":{"parameters":{"query":"100 * (1 - sum(node_memory_MemAvailable_bytes{job=\"node-exporter\"}) / sum(node_memory_MemTotal_bytes{job=\"node-exporter\"}))"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},"topCPU":{"parameters":{"query":"sort_desc(topk(3, sum by(namespace) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\",pod!=\"\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\"}[5m]))))"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"},"topMemory":{"parameters":{"query":"sort_desc(topk(3, sum by(namespace) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\",pod!=\"\",job=\"kubelet\",metrics_path=\"/metrics/cadvisor\"})))"},"url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"}},"template":"{{ $ok := and (eq .Response.StatusCode 200) (eq (.JSON.String \"status\") \"success\") (eq (len (.JSON.Array \"data.result\")) 2) }}\n{{ range .JSON.Array \"data.result\" }}\n  {{ if ne (.Float \"value.1\") 1.0 }}{{ $ok = false }}{{ end }}\n{{ end }}\n{{ $cpu := .Subrequest \"cpu\" }}\n{{ if not (and (eq $cpu.Response.StatusCode 200) (eq ($cpu.JSON.String \"status\") \"success\") (eq ($cpu.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ $memory := .Subrequest \"memory\" }}\n{{ if not (and (eq $memory.Response.StatusCode 200) (eq ($memory.JSON.String \"status\") \"success\") (eq ($memory.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ $topCPU := .Subrequest \"topCPU\" }}\n{{ if not (and (eq $topCPU.Response.StatusCode 200) (eq ($topCPU.JSON.String \"status\") \"success\") (eq ($topCPU.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ $topMemory := .Subrequest \"topMemory\" }}\n{{ if not (and (eq $topMemory.Response.StatusCode 200) (eq ($topMemory.JSON.String \"status\") \"success\") (eq ($topMemory.JSON.String \"data.resultType\") \"vector\")) }}{{ $ok = false }}{{ end }}\n\n{{ if eq (len ($cpu.JSON.Array \"data.result\")) 0 }}{{ $ok = false }}{{ end }}\n\n{{ if eq (len ($memory.JSON.Array \"data.result\")) 0 }}{{ $ok = false }}{{ end }}\n\n{{ if eq (len ($topCPU.JSON.Array \"data.result\")) 0 }}{{ $ok = false }}{{ end }}\n\n{{ if eq (len ($topMemory.JSON.Array \"data.result\")) 0 }}{{ $ok = false }}{{ end }}\n\n<div class=\"homelab-unavailable\">\n  <p class=\"color-negative\">Update unavailable</p>\n  <p class=\"size-h5 margin-top-5\">Could not refresh this card. Open its title for details.</p>\n</div>\n<div class=\"homelab-current\">\n  {{ if not $ok }}\n  <p class=\"color-negative size-h3\">Resource usage unavailable</p>\n  <p class=\"margin-top-5\">Server or container measurements are missing or older than three minutes.</p>\n{{ else }}\n  <div class=\"dynamic-columns list-with-separator list-gap-20\">\n    <div>\n      <p class=\"size-h6\">CPU · 5 minute average</p>\n      <p class=\"color-highlight size-h2 margin-top-5\">{{ $cpu.JSON.Float \"data.result.0.value.1\" | printf \"%.0f\" }}% busy</p>\n      <ul class=\"list list-gap-10 margin-top-15\">\n        {{ range $topCPU.JSON.Array \"data.result\" }}\n          <li class=\"homelab-row\">\n            <span class=\"homelab-name\">{{ .String \"metric.namespace\" }}</span>\n            <span class=\"color-highlight homelab-value\">{{ .Float \"value.1\" | printf \"%.2f\" }} cores</span>\n          </li>\n        {{ end }}\n      </ul>\n    </div>\n    <div>\n      <p class=\"size-h6\">Memory</p>\n      <p class=\"color-highlight size-h2 margin-top-5\">{{ $memory.JSON.Float \"data.result.0.value.1\" | printf \"%.0f\" }}% used</p>\n      <ul class=\"list list-gap-10 margin-top-15\">\n        {{ range $topMemory.JSON.Array \"data.result\" }}\n          <li class=\"homelab-row\">\n            <span class=\"homelab-name\">{{ .String \"metric.namespace\" }}</span>\n            <span class=\"color-highlight homelab-value\">{{ div (.Float \"value.1\") 1073741824.0 | printf \"%.1f\" }} GiB</span>\n          </li>\n        {{ end }}\n      </ul>\n    </div>\n  </div>\n  <p class=\"size-h6 margin-top-15\">Top three application namespaces · totals include the host</p>\n{{ end }}\n\n  <p class=\"size-h6 color-subdue margin-top-15\">Checked <span {{ now | toRelativeTime }}></span> ago · refresh to update</p>\n</div>\n","title":"Resource consumers","title-url":"http://grafana/d/homelab-overview","type":"custom-api","url":"http://vmsingle-vm-victoria-metrics-k8s-stack.victoria-metrics.svc:8428/api/v1/query"}]},{"size":"small","widgets":[{"cache":"1m","sites":[{"check-url":"http://glance.glance.svc","icon":"si:glance","title":"Glance","url":"http://glance"},{"check-url":"http://longhorn-tailscale.longhorn-system.svc","icon":"auto-invert https://raw.githubusercontent.com/cncf/artwork/main/projects/longhorn/icon/black/longhorn-icon-black.svg","title":"Longhorn","url":"http://longhorn"},{"check-url":"http://immich-tailscale.immich.svc","icon":"si:immich","title":"Immich","url":"http://immich"},{"check-url":"http://grafana-tailscale.victoria-metrics.svc","icon":"si:grafana","title":"Grafana","url":"http://grafana"},{"check-url":"http://192.168.1.225:8501/nix-cache-info","icon":"si:nixos","title":"Nix Cache","url":"http://grafana/d/nix-cache"},{"check-url":"http://argocd-tailscale.argocd.svc","icon":"si:argo","title":"ArgoCD","url":"http://argocd"},{"check-url":"http://kodekamp-web.kodekamp.svc:3000","icon":"si:codewars","title":"KodeKamp","url":"https://kodekamp.teevik.no"},{"check-url":"http://paperless-tail