ses"}]},{"size":"full","widgets":[{"type":"group","widgets":[{"type":"hacker-news"},{"type":"lobsters"}]},{"channels":["UCR-DXc1voovS8nhAvccRZhg","UCsBjURrPoezykLs9EqgamOA","UCXuqSBlHAE6Xw-yeJA0Tunw","UCHnyfMqiRRG1u-2MsSQLbXA"],"type":"videos"},{"type":"group","widgets":[{"show-thumbnails":true,"subreddit":"selfhosted","type":"reddit"},{"show-thumbnails":true,"subreddit":"homelab","type":"reddit"}]}]}],"name":"Feeds"}],"server":{"assets-path":"/app/assets"},"theme":{"custom-css-file":"/assets/dashboard.css"}}'
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
