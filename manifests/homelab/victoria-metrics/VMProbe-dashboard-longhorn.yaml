apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-longhorn
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: longhorn
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: longhorn
        service_id: longhorn
      targets:
        - http://longhorn-tailscale.longhorn-system.svc
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
