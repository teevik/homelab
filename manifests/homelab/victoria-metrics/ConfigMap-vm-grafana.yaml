apiVersion: v1
data:
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/default/homelab-overview.json
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = ''
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
  plugins: victoriametrics-metrics-datasource
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: vm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.1.1
    helm.sh/chart: grafana-12.7.3
  name: vm-grafana
  namespace: victoria-metrics
