apiVersion: v1
data:
  grafana.ini: |
    [analytics]
    check_for_plugin_updates = false
    check_for_updates = false
    feedback_links_enabled = false
    reporting_enabled = false
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/default/homelab-overview.json
    [log]
    mode = console
    [news]
    news_feed_enabled = false
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = ''
    root_url = http://grafana.tail84b6c.ts.net
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
  plugins: victoriametrics-metrics-datasource,victoriametrics-logs-datasource
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: vm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.2.0
    helm.sh/chart: grafana-12.7.3
  name: vm-grafana
  namespace: victoria-metrics
