apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-ntfy
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: ntfy
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: ntfy
        service_id: ntfy
      targets:
        - http://ntfy.ntfy.svc
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
