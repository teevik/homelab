apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: vm
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-operator
    app.kubernetes.io/version: v0.74.1
    helm.sh/chart: victoria-metrics-operator-0.67.3
  name: vm-victoria-metrics-operator
  namespace: victoria-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: vm
      app.kubernetes.io/name: victoria-metrics-operator
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: vm
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-operator
    spec:
      automountServiceAccountToken: true
      containers:
        - args:
            - --zap-log-level=info
            - --leader-elect
            - --health-probe-bind-address=:8081
          env:
            - name: VM_ANOMALY_VERSION
              value: v1.30.4
            - name: VM_LOGS_VERSION
              value: v1.52.0
            - name: VM_METRICS_VERSION
              value: v1.151.0
            - name: VM_TRACES_VERSION
              value: v0.10.0
            - name: VM_VMALERTMANAGER_ALERTMANAGERVERSION
              value: v0.34.0
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: victoria-metrics-operator
            - name: VM_ENABLEDPROMETHEUSCONVERTEROWNERREFERENCES
              value: "false"
          image: victoriametrics/operator:v0.74.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: probe
            timeoutSeconds: 5
          name: operator
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8081
              name: probe
              protocol: TCP
            - containerPort: 9443
              name: webhook
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: probe
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: vm-victoria-metrics-operator
      terminationGracePeriodSeconds: 30
