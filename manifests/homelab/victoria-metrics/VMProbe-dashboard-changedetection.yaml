apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-changedetection
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: changedetection
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: changedetection
        service_id: changedetection
      targets:
        - http://changedetection-tailscale.changedetection.svc
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
