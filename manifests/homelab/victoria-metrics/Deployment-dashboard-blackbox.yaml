apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-blackbox
  namespace: victoria-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-blackbox
  template:
    metadata:
      labels:
        app: dashboard-blackbox
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --config.file=/config/blackbox.json
          image: quay.io/prometheus/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          name: blackbox
          ports:
            - containerPort: 9115
              name: http
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /config
              name: config
              readOnly: true
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
        - configMap:
            name: dashboard-blackbox
          name: config
