apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-paperless-ngx
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: paperless-ngx
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: paperless-ngx
        service_id: paperless-ngx
      targets:
        - http://paperless-tailscale.paperless-ngx.svc
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
