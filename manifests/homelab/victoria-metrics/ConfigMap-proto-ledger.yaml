apiVersion: v1
data:
  proto-ledger.json: |
    {
      "uid": "proto-ledger",
      "title": "Prototype E \u00b7 Ledger",
      "description": "The week's book-keeping: which volumes got backed up on which day, what storage really costs, and how fast it grows.",
      "tags": [
        "homelab",
        "prototype"
      ],
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timezone": "browser",
      "schemaVersion": 39,
      "fiscalYearStartMonth": 0,
      "version": 1,
      "links": [
        {
          "title": "Prototypes",
          "type": "dashboards",
          "tags": [
            "prototype"
          ],
          "asDropdown": true,
          "includeVars": false,
          "keepTime": true,
          "icon": "external link",
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "options": []
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "status-history",
          "title": "Backup calendar \u00b7 one cell per volume per day",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(changes(longhorn_volume_last_backup_at[1d]) > bool 0) and on (pvc, pvc_namespace) label_replace(label_replace(kube_persistentvolumeclaim_labels{label_recurring_job_group_longhorn_io_backup=\"enabled\"}, \"pvc\", \"$1\", \"persistentvolumeclaim\", \"(.*)\"), \"pvc_namespace\", \"$1\", \"namespace\", \"(.*)\")",
              "legendFormat": "{{pvc_namespace}}/{{pvc}}",
              "refId": "A",
              "range": true,
              "instant": false,
              "interval": "1d"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "dark-red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "no backup",
                      "color": "dark-red",
                      "index": 0
                    },
                    "1": {
                      "text": "backed up",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 1,
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "rowHeight": 0.85,
            "colWidth": 0.9,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "interval": "1d",
          "maxDataPoints": 60,
          "description": "Volumes opted in to the daily backup job. A cell is green when a backup of that volume completed during that day."
        },
        {
          "id": 2,
          "type": "table",
          "title": "Storage ledger",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 24,
            "h": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "longhorn_volume_capacity_bytes",
              "legendFormat": "__auto",
              "refId": "A",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "longhorn_volume_actual_size_bytes",
              "legendFormat": "__auto",
              "refId": "B",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (volume) (longhorn_snapshot_actual_size_bytes)",
              "legendFormat": "__auto",
              "refId": "C",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (volume) (label_replace((100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * on (namespace, persistentvolumeclaim) group_left (volumename) kube_persistentvolumeclaim_info, \"volume\", \"$1\", \"volumename\", \"(.*)\"))",
              "legendFormat": "__auto",
              "refId": "D",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(time() - longhorn_volume_last_backup_at) and (longhorn_volume_last_backup_at > 0)",
              "legendFormat": "__auto",
              "refId": "E",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "label_replace(kube_persistentvolumeclaim_labels{label_recurring_job_group_longhorn_io_backup=\"enabled\"}, \"volume\", \"$1\", \"volumename\", \"(.*)\")",
              "legendFormat": "__auto",
              "refId": "F",
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false,
                "filterable": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Provisioned"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "On disk"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Snapshots"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Filled"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 100
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last backup"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 129600
                        },
                        {
                          "color": "red",
                          "value": 259200
                        }
                      ]
                    }
                  },
                  {
                    "id": "noValue",
                    "value": "never"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Backups"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "daily",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "special",
                        "options": {
                          "match": "null",
                          "result": {
                            "text": "not opted in",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 110
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            },
            "sortBy": [
              {
                "displayName": "On disk",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "volume",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "includeByName": {
                  "pvc_namespace 1": true,
                  "pvc 1": true,
                  "Value #A": true,
                  "Value #B": true,
                  "Value #D": true,
                  "Value #C": true,
                  "Value #E": true,
                  "Value #F": true
                },
                "indexByName": {
                  "pvc_namespace 1": 0,
                  "pvc 1": 1,
                  "Value #A": 2,
                  "Value #B": 3,
                  "Value #D": 4,
                  "Value #C": 5,
                  "Value #F": 6,
                  "Value #E": 7
                },
                "renameByName": {
                  "pvc_namespace 1": "Namespace",
                  "pvc 1": "Volume",
                  "Value #A": "Provisioned",
                  "Value #B": "On disk",
                  "Value #C": "Snapshots",
                  "Value #D": "Filled",
                  "Value #E": "Last backup",
                  "Value #F": "Backups"
                }
              }
            }
          ],
          "description": "Every Longhorn volume: what was asked for, what it really occupies, how much of that is snapshot history, how full the filesystem inside is, whether it is opted in to the daily backup, and when it was last backed up."
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Longhorn pool \u00b7 7 days",
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(longhorn_node_storage_usage_bytes)",
              "legendFormat": "used",
              "refId": "A",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(longhorn_node_storage_capacity_bytes - longhorn_node_storage_reservation_bytes)",
              "legendFormat": "usable capacity",
              "refId": "B",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "gradientMode": "none",
                "showPoints": "never",
                "pointSize": 6,
                "spanNulls": false,
                "axisPlacement": "auto",
                "axisLabel": "",
                "axisBorderShow": false,
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "usable capacity"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Memory \u00b7 7 days",
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "node_memory_MemTotal_bytes{job=\"node-exporter\"} - node_memory_MemAvailable_bytes{job=\"node-exporter\"}",
              "legendFormat": "used",
              "refId": "A",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_container_resource_requests{resource=\"memory\"})",
              "legendFormat": "requested by pods",
              "refId": "B",
              "range": true,
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "node_memory_MemTotal_bytes{job=\"node-exporter\"}",
              "legendFormat": "total",
              "refId": "C",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "gradientMode": "none",
                "showPoints": "never",
                "pointSize": 6,
                "spanNulls": false,
                "axisPlacement": "auto",
                "axisLabel": "",
                "axisBorderShow": false,
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "total"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "requested by pods"
                },
                "properties": [
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Log lines per day",
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "expr": "* | stats by (kubernetes.pod_namespace) count() lines",
              "refId": "A",
              "queryType": "statsRange",
              "legendFormat": "{{kubernetes.pod_namespace}}",
              "step": "1d"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 2,
                "fillOpacity": 80,
                "gradientMode": "none",
                "showPoints": "never",
                "pointSize": 6,
                "spanNulls": false,
                "axisPlacement": "auto",
                "axisLabel": "",
                "axisBorderShow": false,
                "scaleDistribution": {
                  "type": "linear"
                },
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "right",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "Snapshot history per volume",
          "gridPos": {
            "x": 12,
            "y": 30,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(topk(10, sum by (pvc) (longhorn_snapshot_actual_size_bytes * on (volume) group_left (pvc) group by (volume, pvc) (longhorn_volume_capacity_bytes))))",
              "legendFormat": "{{pvc}}",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": true
            },
            "orientation": "horizontal",
            "displayMode": "basic",
            "valueMode": "color",
            "namePlacement": "left",
            "showUnfilled": true,
            "sizing": "auto",
            "minVizHeight": 16,
            "minVizWidth": 8,
            "maxVizHeight": 300,
            "legend": {
              "showLegend": false
            }
          },
          "description": "Space held by snapshot chains. Reclaimed when old snapshots are purged."
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Root disk \u00b7 runway",
          "gridPos": {
            "x": 0,
            "y": 38,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "clamp_max(node_filesystem_avail_bytes{job=\"node-exporter\",mountpoint=\"/\"} / clamp_min(-deriv(node_filesystem_avail_bytes{job=\"node-exporter\",mountpoint=\"/\"}[7d]), 1) / 86400, 3650)",
              "legendFormat": "__auto",
              "refId": "A",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 14
                  },
                  {
                    "color": "text",
                    "value": 60
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "range",
                  "options": {
                    "from": 3650,
                    "to": 1000000000000.0,
                    "result": {
                      "text": "not shrinking",
                      "index": 0
                    }
                  }
                }
              ],
              "noValue": "0",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "wideLayout": true,
