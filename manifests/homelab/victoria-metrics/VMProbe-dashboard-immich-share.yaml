apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-immich-share
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: immich-share
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: immich
        service_id: immich-share
      targets:
        - http://immich-public-proxy.immich.svc:3000
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
