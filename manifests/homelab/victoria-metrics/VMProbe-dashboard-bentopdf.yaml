apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-bentopdf
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: bentopdf
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: bentopdf
        service_id: bentopdf
      targets:
        - http://bentopdf.bentopdf.svc
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
