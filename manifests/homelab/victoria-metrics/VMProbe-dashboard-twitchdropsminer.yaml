apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-twitchdropsminer
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: twitchdropsminer
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: twitchdropsminer
        service_id: twitchdropsminer
      targets:
        - http://twitchdropsminer.twitchdropsminer.svc
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
