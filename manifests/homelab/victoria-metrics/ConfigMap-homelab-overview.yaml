apiVersion: v1
data:
  homelab-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": false,
      "refresh": "30s",
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "datasource", "uid": "grafana" },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "alertInstanceLabelFilter": "{alertname!~\"Watchdog|InfoInhibitor\"}",
            "alertName": "",
            "dashboardAlerts": false,
            "groupBy": [],
            "groupMode": "default",
            "maxItems": 20,
            "sortOrder": 1,
            "stateFilter": {
              "error": true,
              "firing": true,
              "noData": true,
              "normal": false,
              "pending": true
            },
            "viewMode": "list"
          },
          "title": "Active Alerts",
          "type": "alertlist"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 2,
          "title": "Pods",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "green" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 7 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
              "legendFormat": ""
            }
          ],
          "title": "Running Pods",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "yellow" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "yellow", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 7 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Pending\"}) or vector(0)",
              "legendFormat": ""
            }
          ],
          "title": "Pending Pods",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "red" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 7 },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Failed\"}) or vector(0)",
              "legendFormat": ""
            }
          ],
          "title": "Failed Pods",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] }
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 7 },
          "id": 6,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "count(kube_pod_info)",
              "legendFormat": ""
            }
          ],
          "title": "Total Pods",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 11 },
          "id": 7,
          "title": "Quick CPU / Mem / Disk",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Resource pressure via PSI",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "mappings": [],
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "percentage",
                "steps": [
                  { "color": "green" },
                  { "color": "dark-yellow", "value": 70 },
                  { "color": "dark-red", "value": 90 }
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 12 },
          "id": 8,
          "options": {
            "displayMode": "basic",
            "maxVizHeight": 300,
            "minVizHeight": 10,
            "minVizWidth": 0,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "targets": [
            {
              "expr": "irate(node_pressure_cpu_waiting_seconds_total{instance=\"$node\",job=\"$job\"}[$__rate_interval])",
              "format": "time_series",
              "instant": true,
              "legendFormat": "CPU",
              "refId": "A"
            },
            {
              "expr": "irate(node_pressure_memory_waiting_seconds_total{instance=\"$node\",job=\"$job\"}[$__rate_interval])",
              "format": "time_series",
              "instant": true,
              "legendFormat": "Mem",
              "refId": "B"
            },
            {
              "expr": "irate(node_pressure_io_waiting_seconds_total{instance=\"$node\",job=\"$job\"}[$__rate_interval])",
              "format": "time_series",
              "instant": true,
              "legendFormat": "I/O",
              "refId": "C"
            }
          ],
          "title": "Pressure",
          "type": "bargauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Overall CPU busy percentage (averaged across all cores)",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "rgba(50, 172, 45, 0.97)" },
                  { "color": "rgba(237, 129, 40, 0.89)", "value": 85 },
                  { "color": "rgba(245, 54, 54, 0.9)", "value": 95 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 3, "y": 12 },
          "id": 9,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "targets": [
            {
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\", instance=\"$node\"}[$__rate_interval])))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "CPU Busy",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "System load over all CPU cores together",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "rgba(50, 172, 45, 0.97)" },
                  { "color": "rgba(237, 129, 40, 0.89)", "value": 85 },
                  { "color": "rgba(245, 54, 54, 0.9)", "value": 95 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 6, "y": 12 },
          "id": 10,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "targets": [
            {
              "expr": "scalar(node_load1{instance=\"$node\",job=\"$job\"}) * 100 / count(count(node_cpu_seconds_total{instance=\"$node\",job=\"$job\"}) by (cpu))",
              "format": "time_series",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Sys Load",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Real RAM usage excluding cache and reclaimable memory",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "rgba(50, 172, 45, 0.97)" },
                  { "color": "rgba(237, 129, 40, 0.89)", "value": 80 },
                  { "color": "rgba(245, 54, 54, 0.9)", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 9, "y": 12 },
          "id": 11,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "targets": [
            {
              "expr": "clamp_min((1 - (node_memory_MemAvailable_bytes{instance=\"$node\", job=\"$job\"} / node_memory_MemTotal_bytes{instance=\"$node\", job=\"$job\"})) * 100, 0)",
              "format": "time_series",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "RAM Used",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Percentage of swap space currently used",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "rgba(50, 172, 45, 0.97)" },
                  { "color": "rgba(237, 129, 40, 0.89)", "value": 10 },
                  { "color": "rgba(245, 54, 54, 0.9)", "value": 25 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 12, "y": 12 },
          "id": 12,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "targets": [
            {
              "expr": "((node_memory_SwapTotal_bytes{instance=\"$node\",job=\"$job\"} - node_memory_SwapFree_bytes{instance=\"$node\",job=\"$job\"}) / (node_memory_SwapTotal_bytes{instance=\"$node\",job=\"$job\"})) * 100",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "SWAP Used",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Used Root FS",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "rgba(50, 172, 45, 0.97)" },
                  { "color": "rgba(237, 129, 40, 0.89)", "value": 80 },
                  { "color": "rgba(245, 54, 54, 0.9)", "value": 90 }
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 4, "w": 3, "x": 15, "y": 12 },
          "id": 13,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "targets": [
            {
              "expr": "(\n  (node_filesystem_size_bytes{instance=\"$node\", job=\"$job\", mountpoint=\"/\", fstype!=\"rootfs\"}\n   - node_filesystem_avail_bytes{instance=\"$node\", job=\"$job\", mountpoint=\"/\", fstype!=\"rootfs\"})\n  / node_filesystem_size_bytes{instance=\"$node\", job=\"$job\", mountpoint=\"/\", fstype!=\"rootfs\"}\n) * 100\n",
              "format": "time_series",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Root FS Used",
          "type": "gauge"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green" }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 2, "w": 2, "x": 18, "y": 12 },
          "id": 14,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "count(count(node_cpu_seconds_total{instance=\"$node\",job=\"$job\"}) by (cpu))",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "CPU Cores",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green" }] },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 2, "w": 2, "x": 20, "y": 12 },
          "id": 15,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes{instance=\"$node\",job=\"$job\"}",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "RAM Total",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green" }] },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 2, "w": 2, "x": 22, "y": 12 },
          "id": 16,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "node_memory_SwapTotal_bytes{instance=\"$node\",job=\"$job\"}",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "SWAP Total",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 0,
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "rgba(50, 172, 45, 0.97)" },
                  { "color": "rgba(237, 129, 40, 0.89)", "value": 70 },
                  { "color": "rgba(245, 54, 54, 0.9)", "value": 90 }
                ]
              },
              "unit": "bytes"
            }
          },
          "gridPos": { "h": 2, "w": 2, "x": 18, "y": 14 },
          "id": 17,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "node_filesystem_size_bytes{instance=\"$node\",job=\"$job\",mountpoint=\"/\",fstype!=\"rootfs\"}",
              "format": "time_series",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "RootFS Total",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "decimals": 1,
              "mappings": [{ "options": { "match": "null", "result": { "text": "N/A" } }, "type": "special" }],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green" }] },
              "unit": "s"
            }
          },
          "gridPos": { "h": 2, "w": 4, "x": 20, "y": 14 },
          "id": 18,
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "expr": "node_time_seconds{instance=\"$node\",job=\"$job\"} - node_boot_time_seconds{instance=\"$node\",job=\"$job\"}",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Uptime",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 },
          "id": 19,
          "title": "Basic CPU / Mem / Net / Disk",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "CPU time spent busy vs idle, split by activity type",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 40,
                "gradientMode": "none",
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "percent" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green" }] },
              "unit": "percentunit"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Busy Iowait" },
                "properties": [{ "id": "color", "value": { "fixedColor": "#890F02", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "Idle" },
                "properties": [{ "id": "color", "value": { "fixedColor": "#052B51", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "Busy System" },
                "properties": [{ "id": "color", "value": { "fixedColor": "#EAB839", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "Busy User" },
                "properties": [{ "id": "color", "value": { "fixedColor": "#0A437C", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "Busy Other" },
                "properties": [{ "id": "color", "value": { "fixedColor": "#6D1F62", "mode": "fixed" } }]
              }
            ]
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 17 },
          "id": 20,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(irate(node_cpu_seconds_total{instance=\"$node\",job=\"$job\", mode=\"system\"}[$__rate_interval])) / scalar(count(count(node_cpu_seconds_total{instance=\"$node\",job=\"$job\"}) by (cpu)))",
              "format": "time_series",
              "legendFormat": "Busy System",
              "refId": "A"
            },
            {
              "expr": "sum(irate(node_cpu_seconds_total{instance=\"$node\",job=\"$job\", mode=\"user\"}[$__rate_interval])) / scalar(count(count(node_cpu_seconds_total{instance=\"$node\",job=\"$job\"}) by (cpu)))",
              "format": "time_series",
              "legendFormat": "Busy User",
              "refId": "B"
            },
            {
              "expr": "sum(irate(node_cpu_seconds_total{instance=\"$node\",job=\"$job\", mode=\"iowait\"}[$__rate_interval])) / scalar(count(count(node_cpu_seconds_total{instance=\"$node\",job=\"$job\"}) by (cpu)))",
              "format": "time_series",
              "legendFormat": "Busy Iowait",
              "refId": "C"
            },
            {
              "expr": "sum(irate(node_cpu_seconds_total{instance=\"$node\",job=\"$job\", mode=~\".*irq\"}[$__rate_interval])) / scalar(count(count(node_cpu_seconds_total{instance=\"$node\",job=\"$job\"}) by (cpu)))",
              "format": "time_series",
              "legendFormat": "Busy IRQs",
              "refId": "D"
            },
            {
              "expr": "sum(irate(node_cpu_seconds_total{instance=\"$node\",job=\"$job\", mode!='idle',mode!='user',mode!='system',mode!='iowait',mode!='irq',mode!='softirq'}[$__rate_interval])) / scalar(count(count(node_cpu_seconds_total{instance=\"$node\",job=\"$job\"}) by (cpu)))",
              "format": "time_series",
              "legendFormat": "Busy Other",
              "refId": "E"
            },
            {
              "expr": "sum(irate(node_cpu_seconds_total{instance=\"$node\",job=\"$job\", mode=\"idle\"}[$__rate_interval])) / scalar(count(count(node_cpu_seconds_total{instance=\"$node\",job=\"$job\"}) by (cpu)))",
              "format": "time_series",
              "legendFormat": "Idle",
              "refId": "F"
            }
          ],
          "title": "CPU Basic",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "RAM and swap usage overview, including caches",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 40,
                "gradientMode": "none",
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green" }] },
              "unit": "bytes"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Swap used" },
                "properties": [{ "id": "color", "value": { "fixedColor": "#BF1B00", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "Total" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "#E0F9D7", "mode": "fixed" } },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.stacking", "value": { "group": false, "mode": "normal" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Cache + Buffer" },
                "properties": [{ "id": "color", "value": { "fixedColor": "#052B51", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "Free" },
                "properties": [{ "id": "color", "value": { "fixedColor": "#7EB26D", "mode": "fixed" } }]
              }
            ]
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 17 },
          "id": 21,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes{instance=\"$node\",job=\"$job\"}",
              "format": "time_series",
              "legendFormat": "Total",
              "refId": "A"
            },
            {
              "expr": "node_memory_MemTotal_bytes{instance=\"$node\",job=\"$job\"} - node_memory_MemFree_bytes{instance=\"$node\",job=\"$job\"} - (node_memory_Cached_bytes{instance=\"$node\",job=\"$job\"} + node_memory_Buffers_bytes{instance=\"$node\",job=\"$job\"} + node_memory_SReclaimable_bytes{instance=\"$node\",job=\"$job\"})",
              "format": "time_series",
              "legendFormat": "Used",
              "refId": "B"
            },
            {
              "expr": "node_memory_Cached_bytes{instance=\"$node\",job=\"$job\"} + node_memory_Buffers_bytes{instance=\"$node\",job=\"$job\"} + node_memory_SReclaimable_bytes{instance=\"$node\",job=\"$job\"}",
              "format": "time_series",
              "legendFormat": "Cache + Buffer",
              "refId": "C"
            },
            {
              "expr": "node_memory_MemFree_bytes{instance=\"$node\",job=\"$job\"}",
              "format": "time_series",
              "legendFormat": "Free",
              "refId": "D"
            },
            {
              "expr": "(node_memory_SwapTotal_bytes{instance=\"$node\",job=\"$job\"} - node_memory_SwapFree_bytes{instance=\"$node\",job=\"$job\"})",
              "format": "time_series",
              "legendFormat": "Swap used",
              "refId": "E"
            }
          ],
          "title": "Memory Basic",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Per-interface network traffic in bits per second",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 40,
                "gradientMode": "none",
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green" }] },
              "unit": "bps"
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "/.*Tx.*/" },
                "properties": [{ "id": "custom.transform", "value": "negative-Y" }]
              }
            ]
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 24 },
          "id": 22,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{instance=\"$node\",job=\"$job\"}[$__rate_interval])*8",
              "format": "time_series",
              "legendFormat": "Rx {{device}}",
              "refId": "A"
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{instance=\"$node\",job=\"$job\"}[$__rate_interval])*8",
              "format": "time_series",
              "legendFormat": "Tx {{device}} ",
              "refId": "B"
            }
          ],
          "title": "Network Traffic Basic",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "description": "Percentage of filesystem space used for each mounted device",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 40,
                "gradientMode": "none",
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green" }] },
              "unit": "percent"
            }
          },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 24 },
          "id": 23,
          "options": {
            "legend": { "calcs": [], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "expr": "((node_filesystem_size_bytes{instance=\"$node\", job=\"$job\", device!~\"rootfs\"} - node_filesystem_avail_bytes{instance=\"$node\", job=\"$job\", device!~\"rootfs\"}) / node_filesystem_size_bytes{instance=\"$node\", job=\"$job\", device!~\"rootfs\"}) * 100",
              "format": "time_series",
              "legendFormat": "{{mountpoint}}",
              "refId": "A"
            }
          ],
          "title": "Disk Space Used Basic",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "id": 24,
          "title": "Namespace Breakdown",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "inspect": false
              },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "CPU (cores)" },
                "properties": [{ "id": "unit", "value": "short" }, { "id": "decimals", "value": 2 }]
              },
              {
                "matcher": { "id": "byName", "options": "Memory" },
                "properties": [{ "id": "unit", "value": "bytes" }]
              },
              {
                "matcher": { "id": "byName", "options": "Pods" },
                "properties": [{ "id": "unit", "value": "short" }]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 32 },
          "id": 25,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "CPU (cores)" }]
          },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))",
              "format": "table",
              "instant": true,
              "legendFormat": ""
            },
            {
              "expr": "sum by (namespace) (container_memory_working_set_bytes{container!=\"\"})",
              "format": "table",
              "instant": true,
              "legendFormat": ""
            },
            {
              "expr": "count by (namespace) (kube_pod_info)",
              "format": "table",
              "instant": true,
              "legendFormat": ""
            }
          ],
          "title": "Namespace Resource Usage",
          "transformations": [
            {
              "id": "seriesToColumns",
              "options": { "byField": "namespace" }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time 1": true, "Time 2": true, "Time 3": true },
                "renameByName": {
                  "namespace": "Namespace",
                  "Value #A": "CPU (cores)",
                  "Value #B": "Memory",
                  "Value #C": "Pods"
                }
              }
            }
          ],
          "type": "table"
        }
      ],
