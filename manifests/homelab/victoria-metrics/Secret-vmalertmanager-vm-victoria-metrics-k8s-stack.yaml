apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/component: alertmanager
    app.kubernetes.io/instance: vm
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-k8s-stack
    app.kubernetes.io/version: v0.32.1
    helm.sh/chart: victoria-metrics-k8s-stack-0.91.2
  name: vmalertmanager-vm-victoria-metrics-k8s-stack
  namespace: victoria-metrics
stringData:
  alertmanager.yaml: |
    receivers:
    - name: ntfy
      webhook_configs:
      - send_resolved: true
        url: http://alertmanager-ntfy:8000/hook
    - name: blackhole
    route:
      receiver: ntfy
      routes:
      - matchers:
        - alertname=~"Watchdog|InfoInhibitor|RecordingRulesNoData"
        receiver: blackhole
    templates:
    - /etc/vm/templates/**/*.tmpl
