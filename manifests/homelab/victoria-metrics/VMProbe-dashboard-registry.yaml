apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-registry
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: registry
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: registry
        service_id: registry
      targets:
        - http://zot.registry.svc:5000/v2/
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
