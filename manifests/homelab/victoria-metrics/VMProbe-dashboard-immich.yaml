apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-immich
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: immich
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: immich
        service_id: immich
      targets:
        - http://immich-tailscale.immich.svc
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
