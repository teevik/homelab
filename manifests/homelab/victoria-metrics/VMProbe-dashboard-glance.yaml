apiVersion: operator.victoriametrics.com/v1beta1
kind: VMProbe
metadata:
  labels:
    homelab.teevik.dev/dashboard: "true"
  name: dashboard-glance
  namespace: victoria-metrics
spec:
  interval: 30s
  jobName: dashboard-http
  module: glance
  scrapeTimeout: 5s
  targets:
    staticConfig:
      labels:
        catalog_app: glance
        service_id: glance
      targets:
        - http://glance.glance.svc
  vmProberSpec:
    url: dashboard-blackbox.victoria-metrics.svc:9115
