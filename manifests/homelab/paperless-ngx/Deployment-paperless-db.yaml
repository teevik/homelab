apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-db
  namespace: paperless-ngx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paperless-db
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: paperless
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: PAPERLESS_DBPASS
                  name: paperless-secrets
            - name: POSTGRES_USER
              value: paperless
          image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          name: postgres
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-db-data
