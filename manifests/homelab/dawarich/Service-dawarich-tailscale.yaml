apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: dawarich
    tailscale.com/proxy-group: ingress
  name: dawarich-tailscale
  namespace: dawarich
spec:
  loadBalancerClass: tailscale
  ports:
    - name: http
      port: 80
      targetPort: 3000
  selector:
    app: dawarich-app
  type: LoadBalancer
