apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: kavita-files
    tailscale.com/proxy-group: ingress
  name: kavita-files
  namespace: kavita
spec:
  loadBalancerClass: tailscale
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: kavita
  type: LoadBalancer
