apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: kavita
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kavita
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: kavita
    spec:
      containers:
        - env:
            - name: FB_ADDRESS
              value: 0.0.0.0
            - name: FB_DATABASE
              value: /database/filebrowser.db
            - name: FB_NOAUTH
              value: "true"
            - name: FB_PORT
              value: "8080"
            - name: FB_ROOT
              value: /library
          image: docker.io/filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
          name: filebrowser
          ports:
            - containerPort: 8080
              name: http
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /database
              name: config
              subPath: filebrowser
            - mountPath: /library
              name: library
        - env:
            - name: TZ
              value: Europe/Oslo
          image: docker.io/jvmilazz0/kavita:0.9.1@sha256:454f2a77ac740b70c58cc7300a11122fc9ce7b7e2161ef5b0d1df8f81067cc85
          name: kavita
          ports:
            - containerPort: 5000
              name: http
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - mountPath: /kavita/config
              name: config
            - mountPath: /library
              name: library
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita-config
        - name: library
          persistentVolumeClaim:
            claimName: kavita-library
