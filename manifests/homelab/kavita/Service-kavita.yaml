apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: kavita
    tailscale.com/proxy-group: ingress
  name: kavita
  namespace: kavita
spec:
  loadBalancerClass: tailscale
  ports:
    - name: http
      port: 80
      targetPort: 5000
  selector:
    app: kavita
  type: LoadBalancer
