apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/hostname: twitchdropsminer
    tailscale.com/proxy-group: ingress
  name: twitchdropsminer
  namespace: twitchdropsminer
spec:
  loadBalancerClass: tailscale
  ports:
    - name: http
      port: 80
      targetPort: 5800
  selector:
    app: twitchdropsminer
  type: LoadBalancer
