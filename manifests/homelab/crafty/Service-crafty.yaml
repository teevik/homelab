apiVersion: v1
kind: Service
metadata:
  name: crafty
  namespace: crafty
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
    - name: https
      port: 8443
      protocol: TCP
      targetPort: 8443
    - name: minecraft
      port: 25565
      protocol: TCP
      targetPort: 25565
  selector:
    app: crafty
